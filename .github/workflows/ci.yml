name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v1-foundation
      - phase6c-staging-storefront
      - phase6d-storefront-completion
      - phase6e-storefront-finalization
      - phase6f-commercial-launch
      - phase6f1-storefront-perfection
      - phase6f2-product-interaction
      - phase6f3-final-storefront
      - commercial-data-completion

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_PROVIDER: disabled
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/andrelook_ci?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OWNER_EMAILS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Runtime dependencies must be clean. The lint-only dependency tree is
      # tracked separately because the current braces advisory has no patched
      # release compatible with Next.js 16.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run db:validate
      - run: npm run db:migration:script
      - run: npm run build
